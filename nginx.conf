# Cache-Control varies by path: hashed assets get long-lived cache,
# everything else (HTML) gets no-cache.
map $uri $cache_control {
    ~^/assets/  "public, max-age=31536000, immutable";
    default     "no-cache";
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # ---- Security headers ----
    # These live in the server block so they apply to all responses.
    # Avoid add_header in location blocks — nginx doesn't inherit parent
    # add_header directives when a child block defines its own.

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control $cache_control always;

    # CSP: self for scripts/styles/images/media/fonts, Google Fonts, inline styles
    # (Vite injects inline style tags), blob: for audio worklets, data: for SVG
    # patterns. Umami (whomst.colonpipe.org) and Cloudflare Web Analytics
    # (static.cloudflareinsights.com, injected by WAF) need script-src + connect-src.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://whomst.colonpipe.org https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://whomst.colonpipe.org https://cloudflareinsights.com; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'" always;

    # ---- SPA routing ----

    # Embed viewer: /embed/ and /embed/<data> -> embed.html
    location ~ ^/embed/ {
        try_files /embed.html =404;
    }

    # Everything else: /s/<data>, /, etc. -> index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
