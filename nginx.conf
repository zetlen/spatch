server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Embed viewer: /embed/ and /embed/<data> → embed.html
    location ~ ^/embed/ {
        try_files /embed.html =404;
    }

    # Everything else: /s/<data>, /, etc. → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
