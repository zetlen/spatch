# Cache-Control varies by file type. Vite hashes all built assets (JS, CSS,
# images, audio) so they're safe to cache indefinitely. HTML entry points
# must always be fresh. Favicons get a moderate cache.
map $uri $cache_control {
    ~*\.(js|css|jpg|jpeg|png|m4a|webp|woff2?)$  "public, max-age=31536000, immutable";
    ~*\.(ico|svg)$                                "public, max-age=86400";
    default                                       "no-cache";
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # ---- Security headers ----
    # These live in the server block so they apply to all responses.
    # Avoid add_header in location blocks — nginx doesn't inherit parent
    # add_header directives when a child block defines its own. The /embed/
    # location is the one deliberate exception: it drops X-Frame-Options for
    # cross-origin embedding and redeclares the rest of this set.

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control $cache_control always;

    # CSP: self for scripts/styles/images/media/fonts, Google Fonts, inline styles
    # (Vite injects inline style tags), blob: for audio worklets, data: for SVG
    # patterns. Umami (whomst.colonpipe.org) and Cloudflare Web Analytics
    # (static.cloudflareinsights.com, injected by WAF) need script-src + connect-src.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://whomst.colonpipe.org https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://whomst.colonpipe.org https://cloudflareinsights.com; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'" always;

    # ---- SPA routing ----

    # Embed viewer: /embed/ and /embed/<data> -> embed.html
    #
    # Cross-origin embedding is the product (share.ts generates iframe
    # snippets for third-party sites), so the server block's X-Frame-Options
    # must not apply here. This location omits XFO and sets an intentional
    # CSP frame-ancestors * instead — per CSP3, browsers ignore XFO when
    # frame-ancestors is present. Any site may frame the read-only viewer;
    # the postMessage command channel stays gated by the ?origin= allowlist
    # in embed-entry.ts. The editor (location /) keeps XFO SAMEORIGIN.
    #
    # nginx add_header non-inheritance trap: declaring any add_header in a
    # location drops ALL server-block add_headers for those responses, so
    # the full header set (minus XFO) is redeclared here. Keep it in sync
    # with the server block.
    location ~ ^/embed/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control $cache_control always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://whomst.colonpipe.org https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://whomst.colonpipe.org https://cloudflareinsights.com; frame-src 'self'; frame-ancestors *; object-src 'none'; base-uri 'self'; form-action 'none'" always;

        try_files /embed.html =404;
    }

    # Everything else: /s/<data>, /, etc. -> index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
