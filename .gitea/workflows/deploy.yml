name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: mise-playwright
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PUSH_TOKEN }}

      - name: Bump CalVer version
        run: |
          PREFIX=$(date -u +%Y.%m)
          CURRENT=$(sed -n 's/.*"version": "\(.*\)".*/\1/p' package.json)
          CUR_PREFIX=$(echo "$CURRENT" | cut -d. -f1-2)
          CUR_MICRO=$(echo "$CURRENT" | cut -d. -f3)
          if [ "$CUR_PREFIX" = "$PREFIX" ]; then
            MICRO=$((CUR_MICRO + 1))
          else
            MICRO=1
          fi
          CALVER="$PREFIX.$MICRO"
          sed -i "s/\"version\": \".*\"/\"version\": \"$CALVER\"/" package.json
          git config user.name "Gitea Actions"
          git config user.email "actions@got.colonpipe.org"
          git add package.json
          git commit -m "v$CALVER [skip ci]"
          git push

      - run: mise install
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run lint
      - run: bun run test:unit
      - run: bun run test:e2e

      - name: Build and deploy
        env:
          VITE_UMAMI_URL: ${{ vars.VITE_UMAMI_URL }}
          VITE_UMAMI_SITE_ID: ${{ vars.VITE_UMAMI_SITE_ID }}
        run: |
          bun run build
          docker cp dist/. spatch:/usr/share/nginx/html/
          docker cp nginx.conf spatch:/etc/nginx/conf.d/default.conf
          docker exec spatch nginx -s reload
