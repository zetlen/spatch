name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-slim
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PUSH_TOKEN }}

      - run: apt install -y unzip && curl -fsSL https://bun.com/install | bash
      - run: bun install --frozen-lockfile && bun run check && bun run lint && bun run test:unit

      - name: Build
        env:
          VITE_UMAMI_URL: ${{ vars.VITE_UMAMI_URL }}
          VITE_UMAMI_SITE_ID: ${{ vars.VITE_UMAMI_SITE_ID }}
        run: bun run build

      - name: Bump CalVer version
        run: |
          PREFIX=$(date -u +%Y.%m)
          CURRENT=$(sed -n 's/.*"version": "\(.*\)".*/\1/p' package.json)
          CUR_PREFIX=$(echo "$CURRENT" | cut -d. -f1-2)
          CUR_MICRO=$(echo "$CURRENT" | cut -d. -f3)
          if [ "$CUR_PREFIX" = "$PREFIX" ]; then
            MICRO=$((CUR_MICRO + 1))
          else
            MICRO=1
          fi
          CALVER="$PREFIX.$MICRO"
          sed -i "s/\"version\": \".*\"/\"version\": \"$CALVER\"/" package.json
          git config user.name "Gitea Actions"
          git config user.email "actions@got.colonpipe.org"
          git add package.json
          git commit -m "v$CALVER [skip ci]"
          git push

      - name: Deploy static files + nginx config
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          SSH_OPTS: '-i /tmp/deploy_key -o StrictHostKeyChecking=accept-new'
        run: |
          install -m 600 /dev/null /tmp/deploy_key
          echo "$DEPLOY_SSH_KEY" > /tmp/deploy_key
          ssh $SSH_OPTS "$DEPLOY_HOST" 'rm -rf ~/sites/spatch/dist/*'
          scp $SSH_OPTS -r dist/* "$DEPLOY_HOST":~/sites/spatch/dist/
          scp $SSH_OPTS nginx.conf "$DEPLOY_HOST":~/sites/spatch/nginx.conf
          ssh $SSH_OPTS "$DEPLOY_HOST" 'docker cp ~/sites/spatch/nginx.conf spatch:/etc/nginx/conf.d/default.conf && docker exec spatch nginx -s reload'
          rm -f /tmp/deploy_key

      - name: Post-deploy health check
        run: |
          sleep 2
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' https://spatch.music/)
          if [ "$STATUS" != "200" ]; then
            echo "Health check failed: got HTTP $STATUS"
            exit 1
          fi
          echo "Health check passed: HTTP $STATUS"
