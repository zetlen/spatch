name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: mise-playwright
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PUSH_TOKEN }}

      - name: Bump CalVer version
        run: |
          PREFIX=$(date -u +%Y.%m)
          CURRENT=$(sed -n 's/.*"version": "\(.*\)".*/\1/p' package.json)
          CUR_PREFIX=$(echo "$CURRENT" | cut -d. -f1-2)
          CUR_MICRO=$(echo "$CURRENT" | cut -d. -f3)
          if [ "$CUR_PREFIX" = "$PREFIX" ]; then
            MICRO=$((CUR_MICRO + 1))
          else
            MICRO=1
          fi
          CALVER="$PREFIX.$MICRO"
          sed -i "s/\"version\": \".*\"/\"version\": \"$CALVER\"/" package.json
          git config user.name "Gitea Actions"
          git config user.email "actions@got.colonpipe.org"
          git add package.json
          git commit -m "v$CALVER [skip ci]"
          git push

      - run: mise install
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run lint
      - run: bun run test:unit

      - name: Build
        env:
          VITE_UMAMI_URL: ${{ vars.VITE_UMAMI_URL }}
          VITE_UMAMI_SITE_ID: ${{ vars.VITE_UMAMI_SITE_ID }}
        run: bun run build

      - name: Deploy via rsync
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          eval "$(ssh-agent -s)"
          echo "$DEPLOY_SSH_KEY" | ssh-add -
          rsync -az -e 'ssh -o StrictHostKeyChecking=accept-new' --delete dist/ ${{ vars.DEPLOY_HOST }}:/usr/share/nginx/html/
          rsync -az -e 'ssh -o StrictHostKeyChecking=accept-new' nginx.conf ${{ vars.DEPLOY_HOST }}:/etc/nginx/conf.d/default.conf
          ssh -o StrictHostKeyChecking=accept-new ${{ vars.DEPLOY_HOST }} 'sudo nginx -s reload'
          ssh-agent -k

      - name: Post-deploy health check
        run: |
          sleep 2
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' https://spatch.music/)
          if [ "$STATUS" != "200" ]; then
            echo "Health check failed: got HTTP $STATUS"
            exit 1
          fi
          echo "Health check passed: HTTP $STATUS"
