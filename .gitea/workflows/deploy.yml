name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PUSH_TOKEN }}

      - name: Bump CalVer version
        run: |
          CALVER=$(date -u +%Y.%m.%d)
          CURRENT=$(sed -n 's/.*"version": "\(.*\)".*/\1/p' package.json)
          if [ "$CURRENT" = "$CALVER" ]; then
            echo "Version already $CALVER, skipping bump"
          else
            sed -i "s/\"version\": \".*\"/\"version\": \"$CALVER\"/" package.json
            git config user.name "Gitea Actions"
            git config user.email "actions@got.colonpipe.org"
            git add package.json
            git commit -m "v$CALVER [skip ci]"
            git push
          fi

      - run: curl -fsSL https://bun.sh/install | bash
      - name: Build and deploy
        run: |
          export BUN_INSTALL="$HOME/.bun"
          export PATH="$BUN_INSTALL/bin:$PATH"
          bun install --frozen-lockfile
          bun run build
          docker cp dist/. spatch:/usr/share/nginx/html/
