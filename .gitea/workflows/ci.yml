name: CI
on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: mise-playwright
    steps:
      - uses: actions/checkout@v4
      - run: mise install
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run lint
      - run: bun run fmt:check
      - run: bun run test:unit
      - run: bun run test:e2e -- --reporter=list
      - run: bun run build
      - name: Quality summary
        run: |
          echo "=== File sizes (code lines, largest first) ==="
          find js -name '*.ts' -exec grep -cvE '^\s*$|^\s*//' {} + | sort -t: -k2 -rn | head -15
          echo ""
          echo "If any file exceeds 800 code lines, the refactor has regressed."
