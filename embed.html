<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>spatch</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #e8e4e0;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        font-family: 'Imbue', serif;
      }
      #wrap {
        position: relative;
        width: min(90vw, 90vh, 600px);
        height: min(90vw, 90vh, 600px);
        overflow: hidden;
      }
      #tile {
        position: absolute;
        inset: 0;
        background: #2a2a2a;
      }
      svg#c {
        position: relative;
        display: block;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }
      #play-btn {
        position: absolute;
        bottom: 12px;
        right: 12px;
        background: #d5d0cb;
        border-width: 1px;
        border-style: solid;
        border-color: #f0ece8 #a8a39d #a8a39d #f0ece8;
        color: #2a2a2a;
        width: 44px;
        height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 2px;
        cursor: pointer;
        transition: background 0.15s;
      }
      #play-btn:hover {
        background: #ccc7c1;
      }
      #play-btn.playing {
        background: #c5c0ba;
        border-color: #a8a39d #f0ece8 #f0ece8 #a8a39d;
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <div id="tile"></div>
      <svg id="c" viewBox="0 0 1 1" preserveAspectRatio="xMidYMid meet"></svg>
      <button id="play-btn" title="Play">
        <svg width="20" height="20"><use href="tabler-sprite.svg#tabler-player-play-filled" /></svg>
      </button>
    </div>
    <script type="module" src="js/embed-entry.ts"></script>
  </body>
</html>
