<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>spatch</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      #scene-bg {
        position: fixed;
        inset: 0;
        background-size: cover;
        background-position: center;
      }
      #embed {
        position: relative;
        width: 100%;
        height: 100%;
        cursor: pointer;
        visibility: hidden;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        touch-action: none;
      }
      #embed.ready {
        visibility: visible;
      }
      #tile {
        position: absolute;
        inset: 8px;
        background: linear-gradient(135deg, #404040d1 0%, #222222e2 100%);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.1),
          0 20px 40px rgba(0, 0, 0, 0.4);
        overflow: hidden;
        transition: transform 0.12s ease-out;
      }
      svg#c {
        position: absolute;
        inset: 18px;
        display: block;
        width: calc(100% - 36px);
        height: calc(100% - 36px);
        background: transparent;
        overflow: hidden;
        transition: transform 0.12s ease-out;
      }
      #embed.pressing #tile,
      #embed.pressing svg#c {
        transform: scale(0.97);
      }
      /* Gleam animation */
      #tile::after {
        content: '';
        position: absolute;
        inset: 0;
        z-index: 3;
        pointer-events: none;
        background: linear-gradient(
          115deg,
          transparent 0%,
          transparent 40%,
          rgba(255, 255, 255, 0.15) 50%,
          transparent 60%,
          transparent 100%
        );
        transform: translateX(-120%);
        opacity: 0;
      }
      #embed.gleam #tile::after {
        animation: gleam 0.8s ease-in-out forwards;
      }
      @keyframes gleam {
        0% {
          transform: translateX(-120%);
          opacity: 1;
        }
        100% {
          transform: translateX(120%);
          opacity: 1;
        }
      }
      .error-msg {
        color: #999;
        text-align: center;
        padding: 2em;
        font-family: sans-serif;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div id="scene-bg"></div>
    <div id="embed">
      <div id="tile"></div>
      <svg id="c" viewBox="0 0 1 1" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
    <script type="module" src="js/embed-entry.ts"></script>
  </body>
</html>
