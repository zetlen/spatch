<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>spatch</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #0a0a1a;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        font-family: 'Share Tech Mono', monospace;
      }
      #wrap {
        position: relative;
        width: min(90vw, 90vh, 600px);
        height: min(90vw, 90vh, 600px);
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #1a1a2e;
        box-shadow: 0 0 30px rgba(0, 240, 255, 0.08);
      }
      #play-btn {
        position: absolute;
        bottom: 12px;
        right: 12px;
        background: linear-gradient(135deg, #ff2d95, #b44dff);
        border: none;
        color: white;
        font-family: 'Orbitron', 'Share Tech Mono', monospace;
        font-weight: 700;
        font-size: 13px;
        padding: 8px 20px;
        border-radius: 4px;
        cursor: pointer;
        letter-spacing: 2px;
        transition: all 0.2s;
      }
      #play-btn:hover {
        box-shadow: 0 0 20px rgba(255, 45, 149, 0.5);
      }
      #play-btn.playing {
        background: linear-gradient(135deg, #00f0ff, #b44dff);
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <canvas id="c" width="800" height="800"></canvas>
      <button id="play-btn">&#9654; PLAY</button>
    </div>
    <script type="module" src="js/embed-entry.js"></script>
  </body>
</html>
