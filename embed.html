<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>spatch</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #e8e4e0;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        font-family: 'Share Tech Mono', monospace;
      }
      #wrap {
        position: relative;
        width: min(90vw, 90vh, 600px);
        height: min(90vw, 90vh, 600px);
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #2a2a2a;
      }
      #play-btn {
        position: absolute;
        bottom: 12px;
        right: 12px;
        background: #d5d0cb;
        border-width: 1px;
        border-style: solid;
        border-color: #f0ece8 #a8a39d #a8a39d #f0ece8;
        color: #2a2a2a;
        font-family: 'Orbitron', 'Share Tech Mono', monospace;
        font-weight: 700;
        font-size: 13px;
        padding: 8px 20px;
        border-radius: 2px;
        cursor: pointer;
        letter-spacing: 2px;
        transition: background 0.15s;
      }
      #play-btn:hover {
        background: #ccc7c1;
      }
      #play-btn.playing {
        background: #c5c0ba;
        border-color: #a8a39d #f0ece8 #f0ece8 #a8a39d;
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <canvas id="c" width="800" height="800"></canvas>
      <button id="play-btn">&#9654; PLAY</button>
    </div>
    <script type="module" src="js/embed-entry.ts"></script>
  </body>
</html>
