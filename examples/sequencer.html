<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>spatch sequencer</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        background: #111;
        color: #ccc;
        font-family: system-ui, sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 24px;
        gap: 20px;
      }
      h1 {
        font-size: 18px;
        font-weight: 400;
        letter-spacing: 0.05em;
        color: #888;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        width: min(90vw, 480px);
      }
      .pad {
        position: relative;
        aspect-ratio: 1;
        border-radius: 8px;
        overflow: hidden;
        border: 2px solid transparent;
        transition:
          border-color 0.1s,
          box-shadow 0.1s;
      }
      .pad.active {
        border-color: rgba(255, 255, 255, 0.5);
        box-shadow: 0 0 20px rgba(255, 255, 255, 0.15);
      }
      .pad iframe {
        width: 100%;
        height: 100%;
        border: none;
        pointer-events: none;
      }
      .pad .label {
        position: absolute;
        bottom: 4px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 11px;
        color: rgba(255, 255, 255, 0.4);
        pointer-events: none;
        z-index: 1;
      }
      .pad .randomize {
        position: absolute;
        bottom: 0;
        right: 0;
        width: 28px;
        height: 28px;
        background: rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 6px 0 8px 0;
        color: rgba(255, 255, 255, 0.5);
        font-size: 14px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 2;
        padding: 0;
        transition:
          background 0.15s,
          color 0.15s;
      }
      .pad .randomize:hover {
        background: rgba(60, 60, 60, 0.7);
        color: rgba(255, 255, 255, 0.8);
      }
      .controls {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      button {
        background: #222;
        color: #ccc;
        border: 1px solid #444;
        border-radius: 6px;
        padding: 8px 20px;
        font-size: 14px;
        cursor: pointer;
        transition: background 0.15s;
      }
      button:hover {
        background: #333;
      }
      button:active {
        background: #444;
      }
      button.playing {
        background: #2a4a2a;
        border-color: #4a8a4a;
      }
      .tempo {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        color: #888;
      }
      .tempo input {
        width: 60px;
        background: #222;
        color: #ccc;
        border: 1px solid #444;
        border-radius: 4px;
        padding: 4px 6px;
        font-size: 13px;
        text-align: center;
      }
      .step-display {
        font-size: 12px;
        color: #555;
        font-family: monospace;
        letter-spacing: 0.15em;
        min-height: 18px;
      }
    </style>
  </head>
  <body>
    <h1>spatch sequencer</h1>
    <div class="grid" id="grid"></div>
    <div class="controls">
      <button id="play-btn">play</button>
      <div class="tempo">
        <label for="bpm">bpm</label>
        <input id="bpm" type="number" value="140" min="40" max="300" step="5" />
      </div>
    </div>
    <div class="step-display" id="step-display"></div>

    <script>
      // ---- Pad definitions: note name + serialized spatch state ----
      // Each pad is a close-harmony voicing: root + major/minor third +
      // fifth below, using different waveforms for timbral variety.
      const pads = [
        { name: 'C4', data: 'CBBhAB5atRgAUAOAAABRCAMR7JAOAAQC1OUVuELTOAA' },
        { name: 'D4', data: 'CBBhAEZGMWutLAOAAQCg76OQAJNOAAQDdmmTeuTWOAA' },
        { name: 'E4', data: 'CBBhAKpGFYv_LAOAAIII1zQTNIJOAAIJZiUVhRTNOAA' },
        { name: 'F4', data: 'CBBhAMM76RTNJAOAAANJaZWgATAOAAQOZOFaszLZOAA' },
        { name: 'G4', data: 'CBBhASJOAcvWKAOAAYQRBzTQpINOAAYRNuUYgASWOAA' },
        { name: 'A4', data: 'CBBhIUpGHduEKQOAAQSw71VR7INOAAQTtieagASTOAA' },
        { name: 'B4', data: 'CBBhAAVB6fvWJAOAAIV5WMchRQOOAAIVQ1rWR7ILOAA' },
        { name: 'C5', data: 'CBBhAA9CAYR7IAOAAABl24dgAQAOAAQChWZhuEJTOAA' },
        { name: 'D5', data: 'CBBhAG5GMiuEJAOAAQF9mmfgAPWOAAQFA76aR7INOAA' },
      ];

      // Note name → pad index
      const noteIndex = {};
      pads.forEach((p, i) => {
        noteIndex[p.name] = i;
      });

      // Root MIDI note for each pad (used by randomizer)
      const padMidi = [60, 62, 64, 65, 67, 69, 71, 72, 74];

      // ---- Random voicing generator ----
      // Builds plain SigilData objects — postMessage handles structured cloning.

      const WAVEFORMS = ['sine', 'pulse', 'blend', 'astroid'];
      const HARMONY_INTERVALS = [3, 4, 5, 7]; // min3, maj3, P4, P5
      const BASS_INTERVALS = [5, 7, 12]; // P4, P5, octave below

      function rnd(min, max) {
        return min + Math.random() * (max - min);
      }
      function pick(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
      }
      function clamp01(n) {
        return Math.max(0, Math.min(1, n));
      }

      // MIDI → normalized Y (G2=43 at bottom, G5=79 at top, 37 semitones)
      function midiToY(midi) {
        return clamp01(1 - (midi - 43) / 36);
      }

      let _vid = 0;
      function vid() {
        return 'r' + (++_vid).toString(36);
      }

      function makeVoice(waveform, midi, x, size, hue, chroma, lightness, timbre) {
        const v = {
          id: vid(),
          waveform,
          x: clamp01(x),
          y: midiToY(midi),
          size: clamp01(size),
          fill: { mode: 'solid', h: hue % 360, c: chroma, l: lightness },
          effect: undefined,
          border: undefined,
        };
        if (waveform !== 'sine') {
          v.timbre = clamp01(timbre || 0);
        }
        return v;
      }

      function randomVoicing(rootMidi) {
        const baseHue = Math.random() * 360;
        const voiceCount = 2 + Math.floor(Math.random() * 3); // 2-4
        const voices = [];

        // Root voice (largest, center)
        const rootWf = pick(WAVEFORMS);
        voices.push(
          makeVoice(
            rootWf,
            rootMidi,
            rnd(0.4, 0.6),
            rnd(0.25, 0.35),
            baseHue,
            rnd(0.1, 0.2),
            rnd(0.55, 0.72),
            rnd(0.15, 0.45),
          ),
        );

        // Harmony voice (third above, offset right)
        const harmMidi = rootMidi + pick(HARMONY_INTERVALS);
        if (harmMidi <= 79) {
          const harmWf = pick(WAVEFORMS);
          voices.push(
            makeVoice(
              harmWf,
              harmMidi,
              rnd(0.62, 0.8),
              rnd(0.13, 0.2),
              (baseHue + rnd(10, 30)) % 360,
              rnd(0.08, 0.14),
              rnd(0.48, 0.6),
              rnd(0.1, 0.4),
            ),
          );
        }

        // Bass voice (fifth/octave below, offset left)
        if (voiceCount >= 3) {
          const bassMidi = rootMidi - pick(BASS_INTERVALS);
          if (bassMidi >= 43) {
            const bassWf = pick(WAVEFORMS);
            voices.push(
              makeVoice(
                bassWf,
                bassMidi,
                rnd(0.2, 0.38),
                rnd(0.1, 0.16),
                (baseHue - rnd(10, 20) + 360) % 360,
                rnd(0.06, 0.12),
                rnd(0.42, 0.52),
                rnd(0.1, 0.3),
              ),
            );
          }
        }

        // Extra color voice (second/sixth/seventh above, small)
        if (voiceCount >= 4) {
          const extraMidi = rootMidi + pick([2, 9, 10]);
          if (extraMidi <= 79) {
            const extraWf = pick(WAVEFORMS);
            voices.push(
              makeVoice(
                extraWf,
                extraMidi,
                rnd(0.35, 0.65),
                rnd(0.08, 0.13),
                (baseHue + rnd(20, 50)) % 360,
                rnd(0.06, 0.1),
                rnd(0.45, 0.55),
                rnd(0.1, 0.35),
              ),
            );
          }
        }

        return {
          voices,
          envelope: {
            attack: rnd(0.02, 0.08),
            decay: rnd(0.1, 0.3),
            sustain: rnd(0.4, 0.8),
            release: rnd(0.2, 0.5),
          },
          scene: 1,
          blend: 'screen',
        };
      }

      // ---- Build the grid ----
      const grid = document.getElementById('grid');
      const padEls = [];
      const iframes = [];
      const readyPads = new Set();

      for (let i = 0; i < pads.length; i++) {
        const pad = pads[i];
        const div = document.createElement('div');
        div.className = 'pad';
        div.id = `pad-${i}`;

        const iframe = document.createElement('iframe');
        iframe.src = `/embed/${pad.data}`;
        div.appendChild(iframe);

        const label = document.createElement('div');
        label.className = 'label';
        label.textContent = pad.name;
        div.appendChild(label);

        const rndBtn = document.createElement('button');
        rndBtn.className = 'randomize';
        rndBtn.textContent = '\u2684'; // die face
        rndBtn.title = 'randomize voicing';
        rndBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          const state = randomVoicing(padMidi[i]);
          send(i, { type: 'load', state });
        });
        div.appendChild(rndBtn);

        grid.appendChild(div);
        padEls.push(div);
        iframes.push(iframe);
      }

      // ---- PostMessage helpers ----
      function send(padIndex, msg) {
        const iframe = iframes[padIndex];
        if (iframe && iframe.contentWindow) {
          iframe.contentWindow.postMessage({ source: 'spatch', ...msg }, location.origin);
        }
      }

      window.addEventListener('message', (e) => {
        if (e.data?.source !== 'spatch') return;
        if (e.data.type === 'ready') {
          // Find which iframe sent this
          for (let i = 0; i < iframes.length; i++) {
            if (e.source === iframes[i].contentWindow) {
              readyPads.add(i);
              break;
            }
          }
        }
      });

      // ---- Sequencer ----

      // Mary Had a Little Lamb melody
      // Each entry: [noteName, durationInBeats]
      // null = rest
      const melody = [
        // "Ma-ry had a lit-tle lamb"
        ['E4', 1],
        ['D4', 1],
        ['C4', 1],
        ['D4', 1],
        // "lit-tle lamb, lit-tle lamb"
        ['E4', 1],
        ['E4', 1],
        ['E4', 2],
        // "Ma-ry had a lit-tle lamb, its"
        ['D4', 1],
        ['D4', 1],
        ['D4', 2],
        // "fleece was white as snow"
        ['E4', 1],
        ['G4', 1],
        ['G4', 2],
        // second verse
        ['E4', 1],
        ['D4', 1],
        ['C4', 1],
        ['D4', 1],
        ['E4', 1],
        ['E4', 1],
        ['E4', 1],
        ['E4', 1],
        ['D4', 1],
        ['D4', 1],
        ['E4', 1],
        ['D4', 1],
        ['C4', 2],
        [null, 2],
      ];

      let playing = false;
      let stepTimer = null;
      let currentStep = 0;
      let activePad = -1;

      const playBtn = document.getElementById('play-btn');
      const bpmInput = document.getElementById('bpm');
      const stepDisplay = document.getElementById('step-display');

      function getBeatMs() {
        return 60000 / (parseInt(bpmInput.value) || 140);
      }

      function highlightPad(index) {
        if (activePad >= 0) {
          padEls[activePad].classList.remove('active');
        }
        activePad = index;
        if (index >= 0) {
          padEls[index].classList.add('active');
        }
      }

      function stopCurrent() {
        if (activePad >= 0) {
          send(activePad, { type: 'stop' });
          highlightPad(-1);
        }
      }

      function playStep() {
        if (!playing) return;

        stopCurrent();

        if (currentStep >= melody.length) {
          currentStep = 0; // loop
        }

        const [note, beats] = melody[currentStep];
        const beatMs = getBeatMs();

        // Display step
        const noteNames = melody.map(([n]) => n || '-');
        const display = noteNames.map((n, i) => (i === currentStep ? `[${n}]` : ` ${n} `)).join('');
        stepDisplay.textContent = display;

        if (note) {
          const padIdx = noteIndex[note];
          if (padIdx !== undefined) {
            highlightPad(padIdx);
            send(padIdx, { type: 'play' });
            // Stop the note slightly before next step for articulation
            const stopDelay = beatMs * beats * 0.8;
            setTimeout(() => {
              if (playing) {
                send(padIdx, { type: 'stop' });
              }
            }, stopDelay);
          }
        }

        currentStep++;
        stepTimer = setTimeout(playStep, beatMs * beats);
      }

      function startSequencer() {
        playing = true;
        currentStep = 0;
        playBtn.textContent = 'stop';
        playBtn.classList.add('playing');
        playStep();
      }

      function stopSequencer() {
        playing = false;
        if (stepTimer) {
          clearTimeout(stepTimer);
          stepTimer = null;
        }
        stopCurrent();
        currentStep = 0;
        playBtn.textContent = 'play';
        playBtn.classList.remove('playing');
        stepDisplay.textContent = '';
      }

      playBtn.addEventListener('click', () => {
        if (playing) {
          stopSequencer();
        } else {
          startSequencer();
        }
      });

      // Also allow clicking individual pads to trigger them
      padEls.forEach((el, i) => {
        el.addEventListener('pointerdown', () => {
          send(i, { type: 'play' });
          highlightPad(i);
        });
        el.addEventListener('pointerup', () => {
          send(i, { type: 'stop' });
          highlightPad(-1);
        });
        el.addEventListener('pointerleave', () => {
          send(i, { type: 'stop' });
          if (activePad === i) highlightPad(-1);
        });
      });
    </script>
  </body>
</html>
