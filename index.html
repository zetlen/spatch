<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>spatch</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="app">
      <header id="toolbar-top">
        <div class="toolbar-row toolbar-main">
          <div class="toolbar-group title-group">
            <h1 class="logo">SPATCH.</h1>
          </div>

          <div class="toolbar-group play-group">
            <button id="btn-share" class="action-btn" title="Share">
              <svg width="20" height="20"><use href="tabler-sprite.svg#tabler-share" /></svg>
            </button>
          </div>

          <div class="separator"></div>

          <div class="toolbar-group actions-group">
            <button id="btn-undo" class="action-btn" title="Undo (Ctrl+Z)">
              <svg width="20" height="20">
                <use href="tabler-sprite.svg#tabler-arrow-back-up" />
              </svg>
            </button>
            <button id="btn-redo" class="action-btn" title="Redo (Ctrl+Y)">
              <svg width="20" height="20">
                <use href="tabler-sprite.svg#tabler-arrow-forward-up" />
              </svg>
            </button>
          </div>

          <div class="separator"></div>

          <div class="toolbar-group new-group">
            <button id="btn-new" class="action-btn" title="New">
              <svg width="20" height="20"><use href="tabler-sprite.svg#tabler-file-plus" /></svg>
            </button>
          </div>

          <div class="toolbar-group splash-group" style="margin-left: auto">
            <button id="btn-splash" class="action-btn" title="Splash preview">
              <svg width="20" height="20"><use href="tabler-sprite.svg#tabler-sparkles" /></svg>
            </button>
          </div>
        </div>

        <div id="share-menu" class="toolbar-row toolbar-expansion hidden">
          <button class="action-btn" data-action="share" title="Copy link">
            <svg width="20" height="20"><use href="tabler-sprite.svg#tabler-link" /></svg>
          </button>
          <button class="action-btn" data-action="embed" title="Copy embed code">
            <svg width="20" height="20"><use href="tabler-sprite.svg#tabler-code" /></svg>
          </button>
        </div>
      </header>

      <main id="stage">
        <button id="btn-stage" class="stage-btn" title="Cycle stage background">
          <svg width="20" height="20"><use href="tabler-sprite.svg#tabler-photo" /></svg>
        </button>
        <div id="canvas-wrap">
          <div id="tile"></div>
          <svg id="sigil-canvas" viewBox="0 0 1 1" preserveAspectRatio="xMidYMid meet"></svg>
        </div>
        <button id="btn-play" class="stage-play-btn" title="Play">
          <svg class="play-icon" viewBox="0 0 24 24">
            <use href="tabler-sprite.svg#tabler-player-play" />
          </svg>
          <span class="play-mode-badge hidden"></span>
          <svg class="play-ring" viewBox="0 0 68 68">
            <circle class="play-ring-track" cx="34" cy="34" r="31" />
            <circle class="play-ring-fill" cx="34" cy="34" r="31" />
          </svg>
        </button>
        <div id="radial-overlay" class="radial-overlay hidden" aria-hidden="true"></div>
        <button id="btn-credits" class="stage-btn credits-btn" title="Credits">
          <svg width="16" height="16"><use href="tabler-sprite.svg#tabler-heart-search" /></svg>
        </button>
        <div id="credits-overlay" class="credits-overlay hidden" aria-hidden="true">
          <div class="credits-content">
            <ul class="credits-list">
              <li>
                Font:
                <a href="https://fonts.google.com/specimen/Imbue" target="_blank" rel="noopener"
                  >Imbue</a
                >
              </li>
              <li>
                Icons:
                <a href="https://tabler.io/icons" target="_blank" rel="noopener">Tabler Icons</a>
              </li>
              <li>
                Photography:
                <a href="https://liminalsorting.tumblr.com/" target="_blank" rel="noopener"
                  >liminalsorting</a
                >
              </li>
            </ul>
            <p class="credits-tagline">Make your own spatch, why don't you</p>
          </div>
        </div>
      </main>

      <footer id="toolbar-bottom">
        <!-- Shown when no voice is selected -->
        <div id="bottom-tools" class="toolbar-context">
          <div class="toolbar-group tools-group">
            <button class="tool-btn" data-tool="select" title="Select (V)">
              <svg viewBox="0 0 24 24" width="20" height="20">
                <path
                  d="M5 3l14 9.5L11.5 14l-2.5 7L5 3z"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
            <div class="separator"></div>
            <button class="tool-btn shape-btn" data-tool="triangle" title="Triangle">
              <svg viewBox="0 0 24 24" width="20" height="20">
                <polygon
                  points="12,3 22,21 2,21"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                />
              </svg>
            </button>
            <button class="tool-btn shape-btn" data-tool="square" title="Square">
              <svg viewBox="0 0 24 24" width="20" height="20">
                <rect
                  x="3"
                  y="3"
                  width="18"
                  height="18"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                />
              </svg>
            </button>
            <button class="tool-btn shape-btn" data-tool="circle" title="Circle">
              <svg viewBox="0 0 24 24" width="20" height="20">
                <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2" />
              </svg>
            </button>
          </div>
        </div>

        <!-- Shown when a voice is selected -->
        <div id="bottom-props" class="toolbar-context hidden">
          <div class="toolbar-group props-group">
            <button id="btn-deselect" class="action-btn" title="Deselect (Esc)">
              <svg viewBox="0 0 24 24" width="20" height="20">
                <path
                  d="M5 3l14 9.5L11.5 14l-2.5 7L5 3z"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
            <div class="separator"></div>
            <button id="fill-swatch" class="action-btn swatch" title="Fill color">
              <span class="swatch-color"></span>
            </button>

            <button id="btn-pattern" class="action-btn" title="Pattern">
              <svg width="20" height="20"><use href="tabler-sprite.svg#tabler-texture" /></svg>
            </button>

            <button id="btn-blend" class="action-btn" title="Blend mode">
              <svg width="20" height="20">
                <use href="tabler-sprite.svg#tabler-layers-intersect" />
              </svg>
            </button>

            <button id="btn-border" class="action-btn" title="Border">
              <svg width="20" height="20"><use href="tabler-sprite.svg#tabler-border-outer" /></svg>
            </button>

            <button id="btn-duplicate" class="action-btn" title="Duplicate (Ctrl+D)">
              <svg width="20" height="20"><use href="tabler-sprite.svg#tabler-copy" /></svg>
            </button>

            <div class="separator"></div>

            <button id="btn-delete" class="action-btn danger" title="Delete">
              <svg width="20" height="20"><use href="tabler-sprite.svg#tabler-trash" /></svg>
            </button>
          </div>
        </div>

        <!-- Expansion rows (after props in DOM = above props via column-reverse) -->
        <div id="pattern-dropdown" class="toolbar-row toolbar-expansion hidden"></div>
        <div id="bottom-expansion" class="toolbar-row toolbar-expansion hidden"></div>
      </footer>
    </div>

    <script type="module" src="js/app.ts"></script>
  </body>
</html>
