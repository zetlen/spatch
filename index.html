<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- user-scalable=no: prevents double-tap zoom on mobile, which would
         intercept the double-click gesture used for selection cycling -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <title>spatch</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="app">
      <div class="stage-bg" aria-hidden="true"></div>
      <div class="stage-bg" aria-hidden="true"></div>
      <header id="toolbar-top">
        <div class="toolbar-row toolbar-main">
          <div class="toolbar-group title-group">
            <img src="/spatch-logo-v1.png" alt="" class="logo-mark" />
            <h1 class="logo">SPATCH.</h1>
          </div>

          <div class="separator"></div>

          <div class="toolbar-group actions-group">
            <button id="btn-undo" class="action-btn" title="Undo (Ctrl+Z)">
              <svg width="20" height="20">
                <use href="tabler-sprite.svg#tabler-arrow-back-up" />
              </svg>
            </button>
            <button id="btn-redo" class="action-btn" title="Redo (Ctrl+Y)">
              <svg width="20" height="20">
                <use href="tabler-sprite.svg#tabler-arrow-forward-up" />
              </svg>
            </button>
          </div>

          <div class="separator"></div>

          <div class="toolbar-group new-group">
            <button id="btn-randomize" class="action-btn" title="Randomize">
              <svg width="20" height="20"><use href="tabler-sprite.svg#tabler-bowling" /></svg>
            </button>
            <button id="btn-harmonize" class="action-btn" title="Harmonize">
              <svg width="20" height="20"><use href="tabler-sprite.svg#tabler-music-heart" /></svg>
            </button>
            <button id="btn-new" class="action-btn" title="Blank">
              <svg width="20" height="20"><use href="tabler-sprite.svg#tabler-bomb" /></svg>
            </button>
          </div>

          <div class="separator"></div>

          <div class="toolbar-group stage-group">
            <button id="btn-stage" class="action-btn" title="Cycle stage background">
              <svg width="20" height="20"><use href="tabler-sprite.svg#tabler-photo" /></svg>
            </button>
          </div>
        </div>

        <div id="harmonize-panel" class="toolbar-row toolbar-expansion hidden"></div>
        <div id="stage-panel" class="toolbar-row toolbar-expansion hidden"></div>
      </header>

      <main id="stage">
        <!-- canvas-wrap: div owns dark bg, ADSR corner radii, bevel border, and
             audio-reactive elevation shadow. SVG is transparent and renders shapes
             + selection UI only, ensuring they appear above the shadow. -->
        <div id="canvas-wrap">
          <div id="tile"></div>
          <svg id="sigil-canvas" viewBox="0 0 1 1" preserveAspectRatio="xMidYMid meet"></svg>
        </div>
        <div class="stage-controls">
          <button id="btn-play" class="stage-play-btn" title="Play">
            <svg class="play-icon" viewBox="0 0 24 24">
              <path
                d="M6 4.75a1.25 1.25 0 0 1 1.87-1.08l12.5 7.25a1.25 1.25 0 0 1 0 2.16l-12.5 7.25A1.25 1.25 0 0 1 6 19.25V4.75z"
                fill="currentColor"
              />
            </svg>
            <span class="play-mode-badge hidden"></span>
            <svg class="play-ring" viewBox="0 0 68 68">
              <circle class="play-ring-track" cx="34" cy="34" r="31" />
              <circle class="play-ring-fill" cx="34" cy="34" r="31" />
            </svg>
          </button>
          <button id="btn-solo" class="stage-solo-btn" title="Solo selected voice">
            <svg width="40" height="40">
              <use href="tabler-sprite.svg#tabler-circle-letter-s" />
            </svg>
          </button>
        </div>
        <div id="radial-overlay" class="radial-overlay hidden" aria-hidden="true"></div>
        <button id="btn-tutorial" class="tutorial-btn stage-btn" title="Tutorial">
          <svg width="30" height="30"><use href="tabler-sprite.svg#tabler-mood-puzzled" /></svg>
        </button>
        <button id="btn-share" class="share-btn stage-btn" title="Share">
          <svg width="30" height="30"><use href="tabler-sprite.svg#tabler-users-plus" /></svg>
        </button>
        <button id="btn-splash" class="splash-btn stage-btn" title="Splash preview">
          <svg width="30" height="30"><use href="tabler-sprite.svg#tabler-user-screen" /></svg>
        </button>
        <div id="credits-overlay" class="credits-overlay hidden" aria-hidden="true">
          <div class="credits-content">
            <ul class="credits-list">
              <li>
                Font:
                <a href="https://fonts.google.com/specimen/Imbue" target="_blank" rel="noopener"
                  >Imbue</a
                >
              </li>
              <li>
                Icons:
                <a href="https://tabler.io/icons" target="_blank" rel="noopener">Tabler Icons</a>
              </li>
              <li id="credit-photo">Photography: <a target="_blank" rel="noopener"></a></li>
              <li>
                Reverb samples:
                <a
                  href="https://github.com/andigamesandmusic/Reverb.js"
                  target="_blank"
                  rel="noopener"
                  >Andi Braeshe</a
                >
              </li>
            </ul>
            <p class="credits-tagline">Make your own spatch, why don't you.</p>
          </div>
        </div>
        <div id="share-overlay" class="share-overlay hidden" aria-hidden="true">
          <button class="share-close" title="Close">
            <svg width="20" height="20"><use href="tabler-sprite.svg#tabler-x" /></svg>
          </button>
          <div class="share-content">
            <div class="share-section">
              <label class="share-label">Link</label>
              <div class="share-copy-row">
                <code id="share-link" class="share-code"></code>
                <button id="btn-copy-link" class="share-copy-btn" title="Copy link">
                  <svg width="16" height="16"><use href="tabler-sprite.svg#tabler-copy" /></svg>
                </button>
              </div>
            </div>
            <div class="share-section">
              <label class="share-label">Embed</label>
              <div class="share-control-row">
                <span class="share-control-label">Size</span>
                <input type="range" id="share-size" min="64" max="300" value="128" />
                <span id="share-size-value" class="share-control-value">128</span>
              </div>
              <div class="share-copy-row">
                <code id="share-embed-code" class="share-code share-code-multi"></code>
                <button id="btn-copy-embed" class="share-copy-btn" title="Copy embed code">
                  <svg width="16" height="16"><use href="tabler-sprite.svg#tabler-copy" /></svg>
                </button>
              </div>
              <div class="share-preview-wrap">
                <iframe id="share-preview" class="share-preview" title="Embed preview"></iframe>
              </div>
            </div>
          </div>
        </div>
        <div id="splash-overlay" class="splash-overlay">
          <div id="landscape-block" class="landscape-block hidden" aria-hidden="true">
            <div class="landscape-message">
              <svg width="24" height="24">
                <use href="tabler-sprite.svg#tabler-device-mobile-exclamation" />
              </svg>
              <svg width="24" height="24">
                <use href="tabler-sprite.svg#tabler-rotate-clockwise-2" />
              </svg>
            </div>
          </div>
        </div>
      </main>

      <footer id="toolbar-bottom">
        <!-- Shown when no voice is selected -->
        <div id="bottom-tools" class="toolbar-context">
          <div class="toolbar-group tools-group">
            <button class="tool-btn" data-tool="select" title="Select (V)">
              <svg viewBox="0 0 24 24" width="20" height="20">
                <path
                  d="M5 3l14 9.5L11.5 14l-2.5 7L5 3z"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
            <div class="separator"></div>
            <button class="tool-btn shape-btn" data-tool="triangle" title="Triangle">
              <svg viewBox="0 0 24 24" width="20" height="20">
                <polygon
                  points="12,3 22,21 2,21"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                />
              </svg>
            </button>
            <button class="tool-btn shape-btn" data-tool="square" title="Square">
              <svg viewBox="0 0 24 24" width="20" height="20">
                <rect
                  x="3"
                  y="3"
                  width="18"
                  height="18"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                />
              </svg>
            </button>
            <button class="tool-btn shape-btn" data-tool="circle" title="Circle">
              <svg viewBox="0 0 24 24" width="20" height="20">
                <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2" />
              </svg>
            </button>
            <button class="tool-btn shape-btn" data-tool="astroid" title="Astroid">
              <svg viewBox="0 0 24 24" width="20" height="20">
                <path
                  d="M 21,12 C 17.49,12 12,6.51 12,3 C 12,6.51 6.51,12 3,12 C 6.51,12 12,17.49 12,21 C 12,17.49 17.49,12 21,12 Z"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                />
              </svg>
            </button>
            <button class="tool-btn shape-btn" id="btn-stamp" data-tool="stamp" title="Stamp">
              <svg width="20" height="20"><use href="tabler-sprite.svg#tabler-rubber-stamp" /></svg>
            </button>
          </div>
          <div class="toolbar-spacer"></div>
        </div>

        <!-- Shown when a voice is selected -->
        <div id="bottom-props" class="toolbar-context hidden">
          <div class="toolbar-group props-group">
            <button id="btn-deselect" class="action-btn" title="Deselect (Esc)">
              <svg viewBox="0 0 24 24" width="20" height="20">
                <path
                  d="M5 3l14 9.5L11.5 14l-2.5 7L5 3z"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
            <div class="separator"></div>
            <button id="fill-swatch" class="action-btn swatch" title="Fill color">
              <span class="swatch-color"></span>
            </button>

            <button id="btn-pattern" class="action-btn" title="Pattern">
              <svg width="20" height="20"><use href="tabler-sprite.svg#tabler-texture" /></svg>
            </button>

            <button id="btn-blend" class="action-btn" title="Blend mode">
              <svg width="20" height="20">
                <use href="tabler-sprite.svg#tabler-layers-intersect" />
              </svg>
            </button>

            <button id="btn-border" class="action-btn" title="Border">
              <svg width="20" height="20"><use href="tabler-sprite.svg#tabler-border-outer" /></svg>
            </button>

            <div class="separator"></div>

            <button id="btn-duplicate" class="action-btn" title="Duplicate (Ctrl+D)">
              <svg width="20" height="20"><use href="tabler-sprite.svg#tabler-copy" /></svg>
            </button>

            <button id="btn-delete" class="action-btn danger" title="Delete">
              <svg width="20" height="20"><use href="tabler-sprite.svg#tabler-trash" /></svg>
            </button>
          </div>
        </div>

        <!-- Expansion rows (after props in DOM = above props via column-reverse) -->
        <div id="pattern-dropdown" class="toolbar-row toolbar-expansion hidden"></div>
        <div id="bottom-expansion" class="toolbar-row toolbar-expansion hidden"></div>
        <div id="stample-panel" class="toolbar-row toolbar-expansion hidden"></div>
      </footer>
    </div>

    <script type="module" src="js/app.ts"></script>
  </body>
</html>
