<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>spatch</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="app">
      <header id="toolbar-top">
        <div class="toolbar-group title-group">
          <h1 class="logo">SPATCH</h1>
        </div>
        <div class="toolbar-group tools-group">
          <button class="tool-btn" data-tool="select" title="Select (V)">
            <svg viewBox="0 0 24 24" width="20" height="20">
              <path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51z" fill="currentColor" />
            </svg>
          </button>
          <div class="separator"></div>
          <button class="tool-btn shape-btn" data-tool="triangle" title="Triangle">
            <svg viewBox="0 0 24 24" width="20" height="20">
              <polygon
                points="12,3 22,21 2,21"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              />
            </svg>
          </button>
          <button class="tool-btn shape-btn" data-tool="square" title="Square">
            <svg viewBox="0 0 24 24" width="20" height="20">
              <rect
                x="3"
                y="3"
                width="18"
                height="18"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              />
            </svg>
          </button>
          <button class="tool-btn shape-btn" data-tool="circle" title="Circle">
            <svg viewBox="0 0 24 24" width="20" height="20">
              <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2" />
            </svg>
          </button>
          <div class="separator"></div>
          <button class="tool-btn" data-tool="text" title="Add Text">T</button>
          <input
            type="text"
            id="text-input"
            class="text-input hidden"
            placeholder="Type a word..."
            maxlength="40"
          />
        </div>
        <div class="toolbar-group fill-group">
          <div id="fill-swatch" class="swatch" title="Pick color"></div>
        </div>
        <div class="toolbar-group pattern-group">
          <button class="pattern-btn" data-pattern="none" title="None">&#8709;</button>
          <button class="pattern-btn" data-pattern="stripes" title="Stripes">&#9776;</button>
          <button class="pattern-btn" data-pattern="checker" title="Checker">&#9638;</button>
          <button class="pattern-btn" data-pattern="noise" title="Noise">&#9618;</button>
          <button class="pattern-btn" data-pattern="gradient" title="Gradient">&#9653;</button>
          <button class="pattern-btn" data-pattern="rough" title="Rough">&#10070;</button>
        </div>
        <div class="toolbar-group actions-group">
          <button id="btn-undo" class="action-btn" title="Undo (Ctrl+Z)">&#8630;</button>
          <button id="btn-redo" class="action-btn" title="Redo (Ctrl+Y)">&#8631;</button>
        </div>
        <div class="toolbar-group share-group">
          <button id="btn-menu" class="action-btn" title="Share &amp; Embed">&#8943;</button>
          <div id="share-menu" class="share-menu hidden">
            <button class="share-menu-item" data-action="share">
              <svg viewBox="0 0 24 24" width="14" height="14">
                <path
                  d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                />
                <path
                  d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                />
              </svg>
              <span>Share link</span>
            </button>
            <button class="share-menu-item" data-action="embed">
              <svg viewBox="0 0 24 24" width="14" height="14">
                <polyline
                  points="16 18 22 12 16 6"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <polyline
                  points="8 6 2 12 8 18"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
              <span>Embed code</span>
            </button>
          </div>
        </div>
      </header>

      <main id="canvas-area">
        <div id="canvas-wrap">
          <div id="canvas-frame"></div>
          <canvas id="sigil-canvas" width="800" height="800"></canvas>
        </div>
      </main>

      <!-- Color Picker Panel (hidden by default) -->
      <div id="color-picker-panel" class="panel hidden">
        <div class="panel-tabs">
          <button class="panel-tab active" data-tab="solid">Solid</button>
          <button class="panel-tab" data-tab="linear">Linear</button>
        </div>
        <div class="panel-body">
          <div id="tab-solid" class="tab-content active">
            <input type="color" id="color-solid" class="panel-swatch" title="Fill color" />
          </div>
          <div id="tab-linear" class="tab-content">
            <div class="color-stops">
              <label class="color-stop-label">
                <span>Stop 1</span>
                <input
                  type="color"
                  id="color-lin-1"
                  class="panel-swatch"
                  title="Stop 1 color (drives audio)"
                />
              </label>
              <label class="color-stop-label">
                <span>Stop 2</span>
                <input type="color" id="color-lin-2" class="panel-swatch" title="Stop 2 color" />
              </label>
            </div>
            <label class="angle-label">
              <span>Angle</span>
              <input type="range" id="angle-slider" min="0" max="359" value="0" />
            </label>
          </div>
        </div>
      </div>

      <!-- Border Panel (hidden by default) -->
      <div id="border-panel" class="panel hidden">
        <div class="border-controls">
          <div class="border-row">
            <span class="border-label">Color</span>
            <button
              class="border-color-btn active"
              data-border-color="white"
              title="White (octave up)"
            >
              W
            </button>
            <button class="border-color-btn" data-border-color="black" title="Black (octave down)">
              B
            </button>
          </div>
          <div class="border-row">
            <span class="border-label">Style</span>
            <button
              class="border-style-btn active"
              data-border-double="0"
              title="Single (1 octave)"
            >
              Single
            </button>
            <button class="border-style-btn" data-border-double="1" title="Double (2 octaves)">
              Double
            </button>
          </div>
          <div class="border-row">
            <span class="border-label">Thickness</span>
            <input
              type="range"
              id="border-thickness"
              min="1"
              max="100"
              value="50"
              class="border-slider"
            />
          </div>
          <button id="btn-remove-border" class="border-remove-btn">Remove border</button>
        </div>
      </div>

      <!-- Reverb Panel (hidden by default) -->
      <div id="reverb-panel" class="panel hidden">
        <div class="reverb-controls">
          <div class="reverb-row">
            <span class="reverb-label">Style</span>
            <button class="reverb-style-btn active" data-reverb-style="glow">G</button>
            <button class="reverb-style-btn" data-reverb-style="dim">D</button>
          </div>
          <div class="reverb-row">
            <span class="reverb-label">Depth</span>
            <input
              id="reverb-depth"
              class="reverb-slider"
              type="range"
              min="1"
              max="100"
              value="50"
            />
          </div>
          <button id="btn-remove-reverb" class="reverb-remove-btn">Remove</button>
        </div>
      </div>

      <footer id="toolbar-bottom">
        <div class="toolbar-group blend-group">
          <select id="blend-mode" title="Blend mode">
            <option value="soft-light">Soft Light</option>
            <option value="multiply">Multiply</option>
            <option value="screen">Screen</option>
            <option value="overlay">Overlay</option>
            <option value="color-burn">Burn</option>
            <option value="difference">Difference</option>
            <option value="exclusion">Exclusion</option>
          </select>
          <button id="btn-border" class="action-btn" title="Border (octave doubling)">
            &#9632;
          </button>
          <button id="btn-reverb" class="action-btn" title="Reverb (inset shadow)">&#9676;</button>
          <button id="btn-delete" class="action-btn danger" title="Delete (Del)">&#10005;</button>
        </div>
        <div class="toolbar-group play-group">
          <div class="play-fan-wrap">
            <div id="play-fan" class="play-fan" aria-hidden="true">
              <div class="fan-option fan-loop">
                <svg viewBox="0 0 24 24" width="18" height="18">
                  <path
                    d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"
                    fill="currentColor"
                  />
                </svg>
              </div>
              <div class="fan-option fan-lock">
                <svg viewBox="0 0 24 24" width="18" height="18">
                  <path
                    d="M12 2C9.24 2 7 4.24 7 7v4H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12
                           a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7c0-2.76-2.24-5-5-5zm0
                           2c1.66 0 3 1.34 3 3v4H9V7c0-1.66 1.34-3 3-3z"
                    fill="currentColor"
                  />
                </svg>
              </div>
            </div>
            <button id="btn-play" class="play-btn" title="Play (hold for latch / loop)">
              &#9654; PLAY
            </button>
          </div>
        </div>
      </footer>
    </div>

    <script type="module" src="js/app.ts"></script>
  </body>
</html>
