pre-commit:
  piped: true
  commands:
    format:
      glob: '*.{js,ts,json,css,html}'
      run: bunx oxfmt {staged_files}
      stage_fixed: true
    lint:
      glob: '*.{js,ts}'
      run: bunx oxlint --fix {staged_files}
      stage_fixed: true
    typecheck:
      glob: '*.ts'
      run: bunx tsc --noEmit
