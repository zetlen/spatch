pre-commit:
  piped: true
  commands:
    format:
      glob: '*.{js,ts,json,css,html}'
      run: bun run fmt {staged_files}
      stage_fixed: true
    lint:
      glob: '*.{js,ts}'
      run: bun run lint:fix {staged_files}
      stage_fixed: true
    typecheck:
      run: bun run check

pre-push:
  commands:
    rebase-check:
      run: |
        BRANCH=$(git rev-parse --abbrev-ref HEAD)
        if [ "$BRANCH" = "main" ]; then
          exit 0
        fi
        git fetch origin main --quiet
        BEHIND=$(git rev-list --count HEAD..origin/main)
        if [ "$BEHIND" -gt 0 ]; then
          echo ""
          echo "=========================================="
          echo "  PUSH BLOCKED: branch is $BEHIND commit(s) behind origin/main"
          echo "  Run: git rebase origin/main"
          echo "=========================================="
          echo ""
          exit 1
        fi
